name: cicd

on:
  push:
    #paths:
     # - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Short SHA
        run: echo "COMMIT_ID=$(echo ${GITHUB_SHA} | cut -c1-6)" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: vijaygodson/python-app:${{ env.COMMIT_ID }}

      outputs:
        commit_id: ${{ env.COMMIT_ID }}

  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - name: clone repository
        uses: actions/checkout@v4

      - name: modify values.yaml file for argocd
        shell: bash
        run: |
          echo 'updating with ${{ needs.ci.outputs.commit_id }}'
          apt-get update && sudo apt-get install python3-pip -y 
          sudo pip install yq --break-system-packages 
          yq -Yi '.image.tag = "${{ needs.ci.outputs.commit_id }}"' charts/python-app/values.yaml

      - name: commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: 'updates values.yaml wit commit ${{needs.ci.outputs.commit_id}}'

      - name: Install argocd-server
        shell: bash
        run: |
          curl -ksSL -o argocd https://argocd-server.argocd/download/argocd-linux-amd64 \
          chmod +x argocd \
          sudo mv ./argocd /usr/local/bin/argocd

      - name: Argocd App sync
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }}

          argocd app sync python-app1