name: ci

on:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  docker:
    runs-on: self-hosted
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Short SHA
        run: echo "COMMIT_ID=$(echo ${GITHUB_SHA} | cut -c1-6)" >> $GITHUB_ENV

      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: vijaygodson/python-app:${{ env.COMMIT_ID }}